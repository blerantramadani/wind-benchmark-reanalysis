[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-benchmark-reanalysis"
version = "1.0.0"
description = "Multi-year reanalysis of a model-conditional wind-only predictability benchmark (author response to RC1, wes-2026-154)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Blerant Ramadani"}, {name = "Vangel Fustic"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
neural = ["tensorflow>=2.15"]
test = ["pytest>=7"]

[project.scripts]
wbr = "wbr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["reproduction: needs the stored forecast outputs (run after `wbr results --points`)"]
